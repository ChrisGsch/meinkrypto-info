name: Website und Marktdaten veröffentlichen

on:
  push:
    branches:
      - main
  schedule:
    - cron: "02 5,10,15,20 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: R einrichten
        uses: r-lib/actions/setup-r@v2

      - name: R-Pakete einrichten
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quantmod
            any::fredr
            any::ggplot2
            any::dplyr
            any::tidyr
            any::lubridate
            any::corrplot
            any::scales
            any::jsonlite
            any::zoo

      - name: Marktanalysen aktualisieren
        id: market_update
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/update_market_data.R "$GITHUB_WORKSPACE"

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Statische Website bauen
        run: npm run build:pages

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

      - name: Hinweis bei fehlgeschlagener Datenaktualisierung
        if: steps.market_update.outcome == 'failure'
        run: |
          echo "::warning::Der Datenanbieter war nicht erreichbar. Die Website wird mit dem letzten vorhandenen Datenstand veröffentlicht."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
